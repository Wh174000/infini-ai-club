<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购买课程 - infini小镇</title>
  <link rel="stylesheet" href="assets/css/main.css?v=v20260911">
  <style>
    .purchase-section {
      padding: 60px 0;
      min-height: calc(100vh - 200px);
    }
    .purchase-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .back-link:hover {
      color: var(--primary);
    }
    .purchase-card {
      background: var(--paper);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .course-header {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .course-cover-large {
      width: 200px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }
    .course-info h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .course-info .price {
      font-size: 32px;
      color: var(--primary);
      font-weight: 700;
    }
    .course-info .original-price {
      font-size: 18px;
      color: var(--muted);
      text-decoration: line-through;
      margin-left: 12px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .payment-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }
    .payment-option {
      padding: 20px;
      border: 2px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .payment-option:hover {
      border-color: var(--primary);
    }
    .payment-option.selected {
      border-color: var(--primary);
      background: rgba(23, 61, 53, 0.05);
    }
    .payment-option .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .payment-option .name {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .payment-option .desc {
      font-size: 12px;
      color: var(--muted);
    }
    .order-summary {
      background: var(--bg);
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .order-row.total {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: var(--primary-light);
    }
    .btn-submit:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }
    .affiliate-info {
      background: rgba(216, 178, 107, 0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="assets/images/logo.svg" alt="infini小镇" class="logo-img">
        <span>infini小镇</span>
      </a>
    </div>
  </header>

  <section class="purchase-section">
    <div class="container purchase-container">
      <a href="index.html" class="back-link">← 返回课程列表</a>
      
      <div class="purchase-card">
        <div class="course-header">
          <img class="course-cover-large" id="course-cover" src="assets/images/course-workbuddy.svg" alt="课程封面">
          <div class="course-info">
            <h1 id="course-name">加载中...</h1>
            <div>
              <span class="price" id="course-price">¥0</span>
              <span class="original-price" id="course-original-price"></span>
            </div>
            <p id="course-desc" style="margin-top:12px;color:var(--muted);font-size:14px;"></p>
          </div>
        </div>

        <div class="form-group">
          <label>您的姓名 *</label>
          <input type="text" id="customer-name" placeholder="请输入您的姓名" required>
        </div>

        <div class="form-group">
          <label>联系电话 *</label>
          <input type="tel" id="customer-phone" placeholder="请输入您的手机号" required>
        </div>

        <div class="form-group">
          <label>企业名称（可选）</label>
          <input type="text" id="customer-company" placeholder="请输入企业名称">
        </div>

        <div class="form-group">
          <label>支付方式 *</label>
          <div class="payment-options">
            <div class="payment-option selected" data-method="wechat">
              <div class="icon">💬</div>
              <div class="name">微信支付</div>
              <div class="desc">扫码支付</div>
            </div>
            <div class="payment-option" data-method="bank">
              <div class="icon">🏦</div>
              <div class="name">银行转账</div>
              <div class="desc">对公账户</div>
            </div>
            <div class="payment-option" data-method="consult">
              <div class="icon">📞</div>
              <div class="name">咨询报名</div>
              <div class="desc">联系顾问</div>
            </div>
          </div>
        </div>

        <div class="order-summary">
          <div class="order-row">
            <span>课程费用</span>
            <span id="summary-price">¥0</span>
          </div>
          <div class="order-row" id="discount-row" style="display:none;">
            <span>早鸟优惠</span>
            <span id="summary-discount" style="color:#3f8065;">-¥0</span>
          </div>
          <div class="order-row total">
            <span>应付总额</span>
            <span id="summary-total">¥0</span>
          </div>
        </div>

        <button class="btn-submit" id="submit-btn" onclick="submitOrder()">确认支付</button>

        <div class="affiliate-info" id="affiliate-info" style="display:none;">
          <strong>🎯 推广来源：</strong>通州小兵推荐<br>
          <span style="font-size:12px;color:var(--muted);">您的购买将为通州小兵创造佣金收益</span>
        </div>
      </div>
    </div>
  </section>

  <script src="assets/js/config.js?v=v20260911"></script>
  <script src="assets/js/utils.js?v=v20260911"></script>
  <script src="assets/js/affiliate.js?v=v20260911"></script>
  <script>
    // 当前选中的支付方式
    let selectedPayment = 'wechat';
    let currentCourse = null;

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const courseId = getUrlParam('id');
      if (courseId) {
        loadCourse(courseId);
      } else {
        alert('未指定课程');
        window.location.href = 'index.html';
      }
      renderPaymentOptions();
      showAffiliateInfo();
    });

    // 加载课程信息
    function loadCourse(courseId) {
      const course = COURSES_CONFIG.find(c => c.id === courseId);
      if (!course) {
        alert('课程不存在');
        window.location.href = 'index.html';
        return;
      }
      currentCourse = course;
      
      document.getElementById('course-name').textContent = course.name;
      document.getElementById('course-price').textContent = `¥${course.price}`;
      document.getElementById('course-desc').textContent = course.description;
      document.getElementById('course-cover').src = course.cover_image;
      
      if (course.original_price > course.price) {
        document.getElementById('course-original-price').textContent = `¥${course.original_price}`;
        document.getElementById('course-original-price').style.display = 'inline';
        document.getElementById('discount-row').style.display = 'flex';
        const discount = course.original_price - course.price;
        document.getElementById('summary-discount').textContent = `-¥${discount.toFixed(2)}`;
      }
      
      document.getElementById('summary-price').textContent = `¥${course.price}`;
      document.getElementById('summary-total').textContent = `¥${course.price}`;
    }

    // 渲染支付方式选项
    function renderPaymentOptions() {
      document.querySelectorAll('.payment-option').forEach(option => {
        option.addEventListener('click', () => {
          document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');
          selectedPayment = option.dataset.method;
        });
      });
    }

    // 显示推广信息
    function showAffiliateInfo() {
      const source = affiliateTracker.getSource();
      const infoDiv = document.getElementById('affiliate-info');
      if (source) {
        infoDiv.style.display = 'block';
        infoDiv.innerHTML = `<strong>🎯 推广来源：</strong>通州小兵推荐<br><span style="font-size:12px;color:var(--muted);">您的购买将为通州小兵创造佣金收益</span>`;
      }
    }

    // 提交订单
    function submitOrder() {
      const name = document.getElementById('customer-name').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();
      
      if (!name) {
        showToast('请输入您的姓名', 'error');
        return;
      }
      if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
        showToast('请输入正确的手机号', 'error');
        return;
      }
      if (!currentCourse) {
        showToast('课程信息加载失败', 'error');
        return;
      }

      // 生成订单
      const orderId = generateOrderId();
      const commission = calculateCommission(currentCourse.price, currentCourse.affiliate_rate);
      
      const order = {
        id: orderId,
        course_id: currentCourse.id,
        course_name: currentCourse.name,
        price: currentCourse.price,
        customer_name: name,
        customer_phone: phone,
        customer_company: document.getElementById('customer-company').value.trim(),
        payment_method: selectedPayment,
        affiliate_code: affiliateTracker.getSource(),
        affiliate_rate: currentCourse.affiliate_rate,
        commission: commission,
        status: selectedPayment === 'consult' ? 'pending' : 'paid',
        created_at: new Date().toISOString()
      };

      // 保存订单
      saveOrder(order);

      // 根据支付方式处理
      if (selectedPayment === 'wechat') {
        // 微信支付（暂用二维码占位）
        alert(`订单已创建！\n\n订单号：${orderId}\n\n请扫描下方二维码完成支付\n（微信支付接入中）`);
      } else if (selectedPayment === 'bank') {
        alert(`订单已创建！\n\n订单号：${orderId}\n\n请将款项转账至以下账户：\n户名：infini小镇\n账号：XXX（待配置）\n银行：XXX`);
      } else {
        alert(`预约成功！\n\n订单号：${orderId}\n\n我们的顾问将在24小时内联系您\n电话：${phone}`);
      }

      // 跳转到订单页
      setTimeout(() => {
        window.location.href = 'my-orders.html';
      }, 3000);
    }
  </script>
</body>
</html>
